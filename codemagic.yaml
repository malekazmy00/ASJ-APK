workflows:
  android-apk:
    name: ASJ Android APK
    max_build_duration: 30
    environment:
      flutter: stable
      groups:
        - supabase
    scripts:
      - name: التحقق من المتغيرات قبل أي حاجة
        script: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "خطأ فادح: SUPABASE_URL أو SUPABASE_ANON_KEY فاضيين أو مش موجودين."
            echo "راجع Codemagic > Environment variables > تأكد إنهم مضافين تحت Group اسمه supabase بالظبط."
            exit 1
          fi
          echo "المتغيرات موجودة، SUPABASE_URL يبدأ بـ: $(echo $SUPABASE_URL | cut -c1-25)..."
      - name: توليد مجلدات المنصة الناقصة
        script: flutter create . --platforms=android --project-name asj_medical_store --org com.asjmedical
      - name: تنظيف ملف الاختبار الافتراضي
        script: |
          rm -f test/widget_test.dart
      - name: إضافة صلاحيات الكاميرا والإنترنت
        script: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          echo "محتوى الـ manifest قبل التعديل:"
          cat "$MANIFEST"

          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            awk '{print} /<manifest/ && !y {print "    <uses-permission android:name=\"android.permission.INTERNET\" />"; y=1}' "$MANIFEST" > /tmp/manifest2.xml
            mv /tmp/manifest2.xml "$MANIFEST"
          fi
          if ! grep -q 'android.permission.CAMERA' "$MANIFEST"; then
            awk '{print} /<manifest/ && !x {print "    <uses-permission android:name=\"android.permission.CAMERA\" />"; x=1}' "$MANIFEST" > /tmp/manifest3.xml
            mv /tmp/manifest3.xml "$MANIFEST"
          fi
          if ! grep -q 'android.hardware.camera' "$MANIFEST"; then
            awk '{print} /<manifest/ && !z {print "    <uses-feature android:name=\"android.hardware.camera\" android:required=\"false\" />"; z=1}' "$MANIFEST" > /tmp/manifest4.xml
            mv /tmp/manifest4.xml "$MANIFEST"
          fi

          echo "محتوى الـ manifest بعد التعديل:"
          cat "$MANIFEST"

          # فحص حاسم: لو الصلاحية مش موجودة فعلياً بعد كل المحاولات، وقف
          # البناء دلوقتي بدل ما نكمل ونطلع APK ناقص صلاحية الكاميرا
          # بصمت (ده كان السبب الحقيقي في باج "تعذر تشغيل الكاميرا" —
          # الإضافة كانت بتفشل بصمت من غير أي تحقق).
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            echo "خطأ فادح: صلاحية الإنترنت مش موجودة في الـ manifest النهائي."
            exit 1
          fi
          if ! grep -q 'android.permission.CAMERA' "$MANIFEST"; then
            echo "خطأ فادح: صلاحية الكاميرا مش موجودة في الـ manifest النهائي."
            exit 1
          fi
          echo "تم التأكد: صلاحيات الكاميرا والإنترنت موجودة فعلياً في الـ manifest."
      - name: تثبيت الحزم
        script: flutter pub get
      - name: توليد أيقونة التطبيق
        script: dart run flutter_launcher_icons
      - name: فحص شامل للكود قبل البناء
        script: |
          flutter analyze --no-fatal-infos || {
            echo "فيه أخطاء في الكود ظاهرة فوق - البناء هيتوقف هنا قبل ما ياخد وقت إضافي."
            exit 1
          }
      - name: رفع compileSdk لـ 36 لكل المكتبات (آخر خطوة قبل البناء مباشرة)
        script: |
          echo "flutter.compileSdkVersion=36" >> android/local.properties
          echo "flutter.targetSdkVersion=36" >> android/local.properties
      - name: بناء APK
        script: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
    artifacts:
      - build/app/outputs/flutter-apk/*.apk