workflows:
  android-apk:
    name: ASJ Android APK
    max_build_duration: 30
    environment:
      flutter: stable
      groups:
        - supabase
    scripts:
      - name: توليد مجلدات المنصة الناقصة
        script: flutter create . --platforms=android --project-name asj_medical_store --org com.asjmedical
      - name: إضافة صلاحية الكاميرا
        script: |
          if ! grep -q 'CAMERA' android/app/src/main/AndroidManifest.xml; then
            awk '{print} /<manifest / && !x {print "    <uses-permission android:name=\"android.permission.CAMERA\" />"; x=1}' android/app/src/main/AndroidManifest.xml > /tmp/manifest.xml
            mv /tmp/manifest.xml android/app/src/main/AndroidManifest.xml
          fi
      - name: تثبيت الحزم
        script: flutter pub get
      - name: بناء APK
        script: flutter build apk --release --dart-define=SUPABASE_URL=$SUPABASE_URL --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
